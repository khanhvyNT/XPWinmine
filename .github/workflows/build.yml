name: Build XPWinmine

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Detect solution platform
        id: cfg
        shell: pwsh
        run: |
          $platforms = Select-String -Path XPWinmine.sln -Pattern '^\s*Release\|(\S+)\s*=\s*Release\|' |
            ForEach-Object { $_.Matches[0].Groups[1].Value } |
            Select-Object -Unique
          Write-Host "Found platforms: $platforms"
          $pick = $null
          foreach ($p in 'x86','Win32','x64') {
            if ($platforms -contains $p) { $pick = $p; break }
          }
          if (-not $pick) { $pick = $platforms | Select-Object -First 1 }
          if (-not $pick) { throw "No Release configuration found in XPWinmine.sln" }
          Write-Host "Using platform: $pick"
          "platform=$pick" >> $env:GITHUB_OUTPUT

      - name: Force static runtime (/MT)
        shell: pwsh
        run: |
          @'
          <Project>
            <ItemDefinitionGroup Condition="'$(Configuration)'=='Release'">
              <ClCompile>
                <RuntimeLibrary>MultiThreaded</RuntimeLibrary>
              </ClCompile>
            </ItemDefinitionGroup>
          </Project>
          '@ | Set-Content Directory.Build.targets

      - name: Build
        shell: pwsh
        run: >
          msbuild XPWinmine.sln
          /p:Configuration=Release
          /p:Platform=${{ steps.cfg.outputs.platform }}
          /p:WindowsTargetPlatformVersion=10.0
          /m

      - name: Check dependencies
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter *.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          Write-Host "Exe: $($exe.FullName)"
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if ($dumpbin) { & $dumpbin.FullName /dependents $exe.FullName }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: XPWinmine
          path: '**/Release/*.exe'
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '**/Release/*.exe'
