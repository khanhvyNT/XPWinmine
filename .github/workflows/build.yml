name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild XPWinmine.sln /p:Configuration=Release /p:Platform=Win32 /m

      - uses: actions/upload-artifact@v4
        with:
          name: XPWinmine
          path: |
            **/Release/*.exe
